# Publishes the UI to GitHub Pages. By default it serves the games baked into the build
# (src/mocks/showcase.json): no backend, no Riot key. Set the repository variable API_BASE to the
# VM's HTTPS address (deploy/README.md, step 7) to look up any player through the hosted API instead.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vite build --mode ${{ vars.API_BASE && 'production' || 'pages' }} --base=/LeagueVODreview/
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}
      # Pages serves 404.html for unknown paths, so deep links like /review/... still load the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v5
